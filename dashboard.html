<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Web Perusahaan</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

/* HEADER */
.header {
    background: linear-gradient(135deg, #4facfe, #00c6ff);
    height: 100px;
    border-bottom-left-radius: 30px;
    border-bottom-right-radius: 30px;
    padding: 20px;
    color: white;
    position: relative;
}

.profile {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 0px;
}

.profile img {
    width: 50px;
    border-radius: 50%;
}

.profile span {
    font-size: 16px;
}

/* CARD CONTAINER */
.container {
    background: #eaeaea;
    margin: 50px 15px 20px;
    padding: 20px;
    border-radius: 25px;
}

/* GRID MENU */
.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    cursor: pointer;
}

.card:hover {
    transform: translateY(-5px);
}

.icon {
    font-size: 22px;
    margin-bottom: 8px;
}

.card p {
    margin: 0;
    font-size: 12px;
}

/* BOTTOM NAV/ fungsi bagian bawah*/
.bottom-nav {
    position: fixed;
    bottom: 0;
    width: 100%;
  height: 65px;
    background: white;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
}

.bottom-nav div {
    text-align: center;
    font-size: 14px;
    color: gray;
}

.active {
    color: #4facfe;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  background:white;
  padding:20px;
  border-radius:10px;
  text-align:center;
  width:300px;
}
.modal-content input{
  width:80%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* FOOTER LOGIN TERAKHIR */
.footer-login{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#fff;
  border-top:1px solid #eee;
  padding:10px;
  text-align:center;
  font-size:13px;
  color:#555;
}
</style>

</head>
<body>

<div class="header">
    <div class="profile">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
        <span>e-Report</span>
 </div>
</div>

<div class="container">
    <div class="grid">
     
        <div class="card">
	<card id="btnDataDiri">
            <div class="icon">🤵</div>
            </p>Data Diri</p>
        </div>

        <div class="card">
	<card id="btnPerusahaan">
            <div class="icon">🏢</div>
            </p>Perusahaan</p>
        </div>

        <div class="card">
	<card id="btnGaji">
            <div class="icon">💰</div>
            </p>Daftar Gaji</p>
        </div>

        <div class="card">
	<card id="btnPekerjaan">
            <div class="icon">👷‍♂️</div>
            </p>Pekerjaan</p>
        </div>

        <div class="card">
	<card id="btnKalkulator">
            <div class="icon">🔢</div>
            </p>Kalkulator</p>
        </div>

        <div class="card">
	<card id="btnBukuCatatan">
            <div class="icon">📗</div>
            </p>Buku Catatan</p>
        </div>

    </div>
</div>

<div class="bottom-nav">
    <div class="active">🏠<br>Home</div>
    <div>🔊<br id="logoutBtn">Logout</div>
    <div>⚙️<br>Setting</div>
</div>

<!-- MODAL -->
<div id="modalKode" class="modal">
  <div class="modal-content">
    <h3>Masukkan Kode Akses</h3>
    <input type="password" id="inputKode" placeholder="Kode Akses">
    <button id="submitKode">Buka Halaman</button>
  </div>
</div>

<!-- LOGIN TERAKHIR -->
<div class="footer-login">
  <span id="lastLogin">Login terakhir: -</span>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBjDHapatmMS4C2EDFXxp_WQXVhb0UCZZg",
  authDomain: "web-usaha-ivan.firebaseapp.com",
  projectId: "web-usaha-ivan",
  storageBucket: "web-usaha-ivan.appspot.com",
  messagingSenderId: "588839561784",
  appId: "1:588839561784:web:4accd7d9316a5a0ec5d4cd"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* CEK LOGIN */
auth.onAuthStateChanged(user=>{
  if(!user){
    location.href="login.html";
    return;
  }

  const lastLogin = new Date(user.metadata.lastSignInTime);
  document.getElementById("lastLogin").textContent =
    "Login terakhir: " + lastLogin.toLocaleString("id-ID");
});

/* LOGOUT */
logoutBtn.onclick = ()=>{
  auth.signOut().then(()=>location.href="login.html");
};

/* HALAMAN LANGSUNG */
btnDataDiri.onclick = ()=>location.href="DataDiri.html";
btnKalkulator.onclick = ()=>location.href="kalkulator.html";
btnBukuCatatan.onclick = ()=>location.href="BukuCatatan.html";

/* MODAL */
const modal = document.getElementById("modalKode");
const inputKode = document.getElementById("inputKode");
let targetPage="";

function bukaModal(page){
  targetPage=page;
  inputKode.value="";
  modal.style.display="flex";
  inputKode.focus();
}

btnPerusahaan.onclick = ()=>bukaModal("Perusahaan.html");
btnGaji.onclick = ()=>bukaModal("Gaji.html");
btnPekerjaan.onclick = ()=>bukaModal("Pekerjaan.html");

submitKode.onclick = ()=>{
  if(inputKode.value==="1234"){
    location.href=targetPage;
  }else{
    alert("Kode akses salah!");
  }
  modal.style.display="none";
};

window.onclick = e=>{
  if(e.target===modal) modal.style.display="none";
};
</script>

</body>
</html>
